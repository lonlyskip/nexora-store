<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة NEXORA</title><link rel="stylesheet" href="/style.css"><style>.admin-wrap{max-width:1120px;margin:45px auto;padding:0 20px}.admin-box{background:#111;border:1px solid #292929;border-radius:15px;padding:22px;margin:18px 0}.login{max-width:430px;margin:70px auto}.admin-row{border-bottom:1px solid #282828;padding:15px 0;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;align-items:center;font-size:12px}.admin-row:last-child{border:0}.admin-row select{padding:8px}.muted2{color:#999;font-size:12px}.error{color:#ff7581}@media(max-width:700px){.admin-row{grid-template-columns:1fr 1fr}.admin-row>*{min-width:0}}</style></head><body><header class="top"><a class="brand" href="/"><span class="brand-mark">N</span><span>NEXORA<small>ADMIN PANEL</small></span></a><a href="/" class="admin-link">العودة للمتجر ↗</a></header><main class="admin-wrap"><div class="admin-box login" id="login-box"><span class="eyebrow">منطقة محمية</span><h1 style="font-size:30px;letter-spacing:0">لوحة الإدارة</h1><p class="muted2">أدخل كلمة مرور الإدارة التي ضبطتها في Cloudflare.</p><form id="login-form"><label for="password">كلمة مرور الإدارة</label><input id="password" type="password" required autocomplete="current-password"><button class="primary wide" style="margin-top:15px">دخول</button><p id="login-msg" class="error" role="status"></p></form></div><section class="admin-box" id="orders-box" hidden><div class="section-heading"><h2>الطلبات</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="retry-invoices" class="primary">فحص وإعادة إرسال الفواتير</button><button id="refresh" class="primary">تحديث القائمة</button></div></div><p id="invoice-msg" class="muted2" role="status"></p><p class="muted2">تظهر بيانات العميل هنا، بينما يُخفى البريد الإلكتروني في إشعارات Discord حفاظًا على الخصوصية.</p><div id="orders"><p class="muted2">سجّل الدخول لعرض الطلبات.</p></div><p id="orders-msg" class="error" role="status"></p></section></main><script>
let secret="";const msg=document.querySelector("#login-msg"),ordersMsg=document.querySelector("#orders-msg");
document.querySelector("#login-form").addEventListener("submit",async e=>{e.preventDefault();secret=document.querySelector("#password").value;const r=await fetch("/api/admin/orders",{headers:{authorization:"Bearer "+secret}});const d=await r.json();if(!r.ok){msg.textContent=d.error||"تعذر تسجيل الدخول";secret="";return}document.querySelector("#login-box").hidden=true;document.querySelector("#orders-box").hidden=false;render(d.orders||[])});
document.querySelector("#refresh").addEventListener("click",load);
document.querySelector("#retry-invoices").addEventListener("click",retryInvoices);
async function retryInvoices(){const button=document.querySelector("#retry-invoices"),status=document.querySelector("#invoice-msg");button.disabled=true;status.textContent="جاري فحص الفواتير غير المرسلة...";try{const r=await fetch("/api/admin/invoices/retry",{method:"POST",headers:{authorization:"Bearer "+secret}});const d=await r.json();if(!r.ok){status.textContent=d.error||"تعذر فحص الفواتير";return}status.textContent="تم الفحص: "+d.found+" | أُرسلت: "+d.sent+" | فشلت: "+d.failed+" | تم تجاوزها: "+d.skipped+(d.found===0?" | لا توجد فواتير تحتاج إعادة إرسال":"");}catch{status.textContent="تعذر الاتصال بالخادم، حاول مرة أخرى."}finally{button.disabled=false}}
async function load(){const r=await fetch("/api/admin/orders",{headers:{authorization:"Bearer "+secret}});const d=await r.json();if(!r.ok){ordersMsg.textContent=d.error||"تعذر تحميل القائمة";return}ordersMsg.textContent="";render(d.orders||[])}
function render(list){const root=document.querySelector("#orders");if(!list.length){root.innerHTML='<p class="muted2">لا توجد طلبات حتى الآن.</p>';return}root.innerHTML='<div class="admin-row"><b>الطلب / Discord</b><b>الباقة والسعر</b><b>طريقة الدفع</b><b>التاريخ</b><b>الحالة</b></div>'+list.map(o=>'<div class="admin-row"><div><b>'+esc(o.id)+'</b><div>'+esc(o.discord_username)+'</div><div class="muted2">'+esc(o.email||"")+'</div></div><div>'+esc(o.plan_name)+'<br>'+esc(o.price_sar)+' ر.س</div><div>'+esc(new Date(o.created_at).toLocaleString("ar-SA"))+'</div><select data-id="'+esc(o.id)+'">'+(o.status==="paid"?'<option value="paid" selected disabled>تم تأكيد الدفع تلقائيًا</option><option value="delivered">تم التسليم</option>':o.status==="delivered"?'<option value="delivered" selected disabled>تم التسليم</option>':o.status==="cancelled"?'<option value="cancelled" selected disabled>ملغي</option>':'<option value="pending" selected disabled>'+(o.payment_method==="bank_transfer"?"بانتظار مراجعة التحويل":"بانتظار PayPal")+'</option>')+'</select></div>').join("");root.querySelectorAll("select").forEach(s=>s.addEventListener("change",async()=>{const r=await fetch("/api/admin/orders",{method:"PATCH",headers:{authorization:"Bearer "+secret,"content-type":"application/json"},body:JSON.stringify({id:s.dataset.id,status:s.value})});const d=await r.json();ordersMsg.textContent=r.ok?"تم تحديث الحالة":(d.error||"تعذر التحديث");if(!r.ok)load()}))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
